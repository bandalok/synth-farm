[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-farm"
version = "0.1.0"
description = "Synthetic user farm: persona-driven behavioral data to bootstrap recommender systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
synth-farm = "synth_farm.__main__:main"

[tool.setuptools.packages.find]
include = ["synth_farm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
